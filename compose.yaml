services:
  quire:
    image: ghcr.io/astraldeath/quire-server:latest
    restart: unless-stopped
    environment:
      QUIRE_PUBLIC_URL: ${QUIRE_PUBLIC_URL:-http://localhost:8080}
      QUIRE_NAME: ${QUIRE_NAME:-Quire}
      QUIRE_ALLOWED_ORIGINS: ${QUIRE_ALLOWED_ORIGINS:-}
    ports:
      - "127.0.0.1:${QUIRE_PORT:-8080}:8080"
    volumes:
      - quire-data:/data
    tmpfs:
      - /tmp:size=512m,mode=1777
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

volumes:
  quire-data:
