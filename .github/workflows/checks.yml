name: Server checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    container: golang:1.27.1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Trust the checkout in the build container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Locate Go caches
        id: go-cache-paths
        run: |
          echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
      - name: Restore Go modules and compilation
        id: go-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ steps.go-cache-paths.outputs.modules }}
            ${{ steps.go-cache-paths.outputs.build }}
          key: go-v1-${{ runner.os }}-${{ runner.arch }}-1.27.1-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-v1-${{ runner.os }}-${{ runner.arch }}-1.27.1-${{ hashFiles('go.sum') }}-
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/quire-server
      - name: Save Go modules and compilation
        if: github.repository == 'astraldeath/quire-server' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ steps.go-cache-paths.outputs.modules }}
            ${{ steps.go-cache-paths.outputs.build }}
          key: ${{ steps.go-cache.outputs.cache-primary-key }}
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - name: Build smoke-test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: quire-check
          cache-from: type=gha,scope=server-check
          cache-to: ${{ github.repository == 'astraldeath/quire-server' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && 'type=gha,mode=max,scope=server-check' || '' }}
      - name: Check container startup and backup restore
        run: |
          docker run -d --name quire-smoke --read-only --cap-drop ALL --security-opt no-new-privileges:true --tmpfs /tmp:size=128m,mode=1777 --tmpfs /data:uid=65532,gid=65532,mode=0700 -p 127.0.0.1:8080:8080 quire-check
          trap 'docker rm -f quire-smoke' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8080/healthz; then break; fi
            sleep 1
          done
          curl --fail --silent http://localhost:8080/healthz
          curl --fail --silent http://localhost:8080/settings/backups > /dev/null
          docker exec quire-smoke /quire-server backup -output /tmp/smoke.quire-server-backup
          docker exec quire-smoke /quire-server restore -input /tmp/smoke.quire-server-backup -data /tmp/restored
  publish:
    name: Publish container image
    needs: [test, container]
    if: >-
      github.repository == 'astraldeath/quire-server' &&
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4
      - name: Identify published build
        id: identity
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          revision=$(git rev-parse HEAD)
          published_at=$(git show -s --format=%cI HEAD)
          version="main.$(git show -s --format=%cs HEAD | tr -d '-').${revision:0:12}"
          if [ "$REF_TYPE" = tag ]; then version="$REF_NAME"; fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "published_at=$published_at" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ghcr.io/astraldeath/quire-server
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long
            type=ref,event=tag
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=server-publish
          cache-to: type=gha,mode=max,scope=server-publish
          provenance: mode=max
          sbom: true
          build-args: |
            QUIRE_VERSION=${{ steps.identity.outputs.version }}
            QUIRE_REVISION=${{ steps.identity.outputs.revision }}
            QUIRE_BUILD_TIME=${{ steps.identity.outputs.published_at }}
      - name: Publish latest server update information
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BUILD_VERSION: ${{ steps.identity.outputs.version }}
          BUILD_REVISION: ${{ steps.identity.outputs.revision }}
          BUILD_TIME: ${{ steps.identity.outputs.published_at }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          text = pathlib.Path('CHANGELOG.md').read_text()
          notes = text.split('## Current main build\n', 1)[1].split('\n## ', 1)[0].strip()
          if not notes or len(notes.encode()) > 24000:
              raise SystemExit('Provide concise release notes in CHANGELOG.md')
          manifest = dict(version=os.environ['BUILD_VERSION'], revision=os.environ['BUILD_REVISION'],
                          publishedAt=os.environ['BUILD_TIME'], notes=notes,
                          notesUrl=f"https://github.com/astraldeath/quire-server/blob/{os.environ['BUILD_REVISION']}/CHANGELOG.md")
          pathlib.Path('update.json').write_text(json.dumps(manifest))
          pathlib.Path('release-notes.md').write_text('Latest main container build. Update the container manually after reviewing these notes.\n\n' + notes)
          PY
          if gh release view server-latest >/dev/null 2>&1; then
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/server-latest" -f sha="$BUILD_REVISION" -F force=true
            gh release edit server-latest --prerelease --latest=false --title "Latest server build" --notes-file release-notes.md
          else
            gh release create server-latest --target "$BUILD_REVISION" --prerelease --latest=false --title "Latest server build" --notes-file release-notes.md
          fi
          gh release upload server-latest update.json --clobber
