name: Server checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    container: golang:1.27.1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Trust the checkout in the build container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/quire-server
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: docker build -t quire-check .
      - name: Check container startup and backup restore
        run: |
          docker run -d --name quire-smoke --read-only --cap-drop ALL --security-opt no-new-privileges:true --tmpfs /tmp:size=128m,mode=1777 --tmpfs /data:uid=65532,gid=65532,mode=0700 -p 127.0.0.1:8080:8080 quire-check
          trap 'docker rm -f quire-smoke' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8080/healthz; then break; fi
            sleep 1
          done
          curl --fail --silent http://localhost:8080/healthz
          curl --fail --silent http://localhost:8080/settings/backups > /dev/null
          docker exec quire-smoke /quire-server backup -output /tmp/smoke.quire-server-backup
          docker exec quire-smoke /quire-server restore -input /tmp/smoke.quire-server-backup -data /tmp/restored
  publish:
    name: Publish container image
    needs: [test, container]
    if: >-
      github.repository == 'astraldeath/quire-server' &&
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ghcr.io/astraldeath/quire-server
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long
            type=ref,event=tag
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
